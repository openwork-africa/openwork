[workspace]
resolver = "2"
members = ["crates/ow-core", "crates/ow-store", "crates/ow-ai", "crates/ow-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ow-core = { path = "crates/ow-core" }
ow-store = { path = "crates/ow-store" }
ow-ai = { path = "crates/ow-ai" }
