name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task test

  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task fitness

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task build

  base-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task test:base-only

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task test:bundle

  remove-each:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [rooms, text, profile, circle, panel]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: deno task test:remove-each ${{ matrix.plugin }}

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path server/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - uses: dtolnay/rust-toolchain@stable
      - run: deno task build
      - run: cargo build --manifest-path server/Cargo.toml
      - name: Start the server
        run: |
          mkdir -p "$RUNNER_TEMP/openwork-data"
          cargo run --manifest-path server/Cargo.toml -p ow-server -- --static app/dist --data "$RUNNER_TEMP/openwork-data" &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:47410/healthz && break; sleep 1; done
      - run: deno task test:e2e
        env:
          OW_SERVER_URL: http://127.0.0.1:47410
